<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .circle {
            width: 100px;
            height: 100px;
            background-color: #000000;
        }

        .circle:hover {
            animation-name: b;
            animation-duration: 2s;
            animation-iteration-count: infinite;
            position: absolute;
        }

        @keyframes a {
            0% {
                background-color: #000000;
                top: 0px;
                left: 0px;
            }

            25% {
                background-color: #7d0404;
                top: 0px;
                left: 300px;
            }

            50% {
                background-color: #7d0404;
                top: 300px;
                left: 300px;
            }

            75% {
                background-color: #7d0404;
                top: 300px;
                left: 0px;
            }

            100% {
                background-color: #7d0404;
                top: 0px;
                left: 0px;
            }
        }

        @keyframes b {
            from {
                width: 100px;
                height: 100px;
                background-color: rgb(255, 255, 255);
                left: 0;
            }

            to {
                width: 100px;
                height: 100px;
                background-color: red;
                border-radius: 50%;
                left: 100%;
            }

        }

         .animated-image {
            width: 100%;
            height:100vh;
            background-size: cover;
            background-position: center;
            /* Bind the keyframes, set duration to 9 seconds, loop infinitely */
            animation: changeImage 9s infinite;
        }

        @keyframes changeImage {

            0%,
            100% {
                background-image: url('m2.jpg');
            }

            50% {
                background-image: url('m4.webp');
            }
        }
    </style>
</head>

<body>
    <!-- <div class="circle"></div> -->
    <div class="animated-image"></div>

</body>

</html>
