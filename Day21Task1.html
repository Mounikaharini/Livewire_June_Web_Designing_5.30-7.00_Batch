<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        // a	a <= 5		op	a++
        // 1	1 <= 5	TRUE	1	2
        // 2	2 <= 5	TRUE	2	3
        // 3	3 <= 5	TRUE	3	4
        // 4	4 <= 5	TRUE	4	5
        // 5	5 <= 5	TRUE	5	6
        // 6	6 <= 5	FALSE	exit	
				
        for (let i = 1; i <= 5; i++) {
            document.write(i);
        }
				
        // b	b >= 1		    op	b--
        // 5	5 >= 1	TRUE	5	4
        // 4	4 >= 1	TRUE	4	3
        // 3	3 >= 1	TRUE	3	2
        // 2	2 >= 1	TRUE	2	1
        // 1	1 >= 1	TRUE	1	0
        // 0	0 >= 1	FALSE
        
        document.write("<br>");
        for (let i = 5; i >= 1; i--) {
            document.write(i);
        }
        document.write("<br>");
        for (let i = 0; i <= 4; i++) {
            for (let j = 0; j <= 4; j++) {
                document.write("* ");
            }
            document.write("<br>");
        }
        let a = 1;
        while (a <= 5) {
            document.write(a);
            a++;
        }
        document.write("<br>");
        let a1 = 10;
        while (a1 >= 5) {
            document.write(a1);
            a1--;
        }
        document.write("<br>");


        for (let i = 1; i <= 5; i++) {
            for (let j = 1; j <= 5; j++) {
                if(i==1 && j==3){
                    document.write("* ");
                }
                else if(i==2 &&(j==2 || j==4)){
                    document.write("* ");
                }
                else if(i==3){
                    document.write("* ");
                }
                else if((i==4 || i==5) &&(j==1 || j==5)){
                    document.write("* ");
                }
                else{
                    document.write("&nbsp&nbsp&nbsp");
                }
            }
            document.write("<br>");
        }

        for(let i=1;i<=5;i++){
            for(let j=1;j<=5;j++){
                if((i==3) || (j==1) || (j==5)){
                    document.write("* ");
                }
            else{
                    document.write("&nbsp&nbsp&nbsp");
                }
            }
            document.write("<br>");
        }

        for(let i=1;i<=5;i++){
            for(let j=1;j<=5;j++){
                if((j==3) || (i==1) || (i==5)){
                    document.write("* ");
                }
            else{
                    document.write("&nbsp&nbsp&nbsp");
                }
            }
            document.write("<br>");
        }
        for(let i=1;i<=5;i++){
            for(let j=1;j<=5;j++){
                if((j==3) || (i==1)){
                    document.write("* ");
                }
            else{
                    document.write("&nbsp&nbsp&nbsp");
                }
            }
            document.write("<br>");
        }

         for(let i=1;i<=5;i++){
            for(let j=1;j<=5;j++){
                if((i+j==6) || (i==1 || i==5)){
                    document.write("* ");
                }
            else{
                    document.write("&nbsp&nbsp&nbsp");
                }
            }
            document.write("<br>");
        }

    </script>
</body>

</html>
